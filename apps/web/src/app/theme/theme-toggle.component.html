<button
  class="theme-toggle"
  type="button"
  [class.theme-toggle--floating]="floating()"
  [attr.data-theme]="theme()"
  [attr.aria-label]="actionLabel()"
  (click)="toggleTheme()"
>
  @if (theme() === 'dark') {
    <svg
      class="theme-toggle__icon"
      data-icon="sun"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.8"
      stroke-linecap="round"
      aria-hidden="true"
      focusable="false"
    >
      <circle cx="12" cy="12" r="3.25" />
      <path d="M12 2.5v2M12 19.5v2M4.5 12h-2M21.5 12h-2M5.3 5.3 3.9 3.9M20.1 20.1l-1.4-1.4M18.7 5.3l1.4-1.4M3.9 20.1l1.4-1.4" />
    </svg>
  } @else {
    <svg
      class="theme-toggle__icon"
      data-icon="moon"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.8"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
      focusable="false"
    >
      <path d="M20.25 14.2A7.75 7.75 0 0 1 9.8 3.75a8 8 0 1 0 10.45 10.45Z" />
    </svg>
  }
  <span class="theme-toggle__label">{{ actionLabel() }}</span>
</button>
