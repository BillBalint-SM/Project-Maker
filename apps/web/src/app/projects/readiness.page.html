<section aria-labelledby="readiness-page-title">
  <div class="page-heading">
    <span class="eyebrow">Project</span>
    <h1 id="readiness-page-title">Estimation Readiness</h1>
    <p>Current gaps, readiness factors, and clarification follow-ups.</p>
  </div>
  <app-readiness-review
    [projectId]="projectId"
    [refreshKey]="readinessRefreshKey()"
    [dedicatedPage]="true"
  />

  @if (projectStatusLoading()) {
    <p class="discovery-state" aria-live="polite">Loading clarification follow-ups…</p>
  } @else if (projectStatusError(); as error) {
    <div class="discovery-state" role="alert">
      <p>{{ error }}</p>
      <p-button label="Reload clarification follow-ups" [outlined]="true" (onClick)="loadProjectStatus()" />
    </div>
  } @else if (projectStatus(); as status) {
    <app-discovery-follow-ups
      [projectId]="projectId"
      [projectStatus]="status"
      [reviewFollowUpId]="reviewFollowUpId"
      [reviewFollowUpVersion]="reviewFollowUpVersion"
      [reviewCorrespondenceId]="reviewCorrespondenceId"
      (committedChange)="refreshReadiness()"
    />
  }
</section>
