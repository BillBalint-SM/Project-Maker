name: project-maker

services:
  postgres:
    image: postgres:18.4-alpine3.24
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in the selected env file}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the selected env file}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in the selected env file}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - project-maker-internal

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      CORS_ORIGIN: ${CORS_ORIGIN:?Set CORS_ORIGIN in the selected env file}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in the selected env file}
      FOLLOW_UP_POLL_INTERVAL_MS: ${FOLLOW_UP_POLL_INTERVAL_MS:-60000}
      CUSTOMER_MAILBOX_ADDRESS: ${CUSTOMER_MAILBOX_ADDRESS:?Set CUSTOMER_MAILBOX_ADDRESS in the selected env file}
      GRAPH_BASE_URL: ${GRAPH_BASE_URL:-https://graph.microsoft.com}
      GRAPH_LOGIN_BASE_URL: ${GRAPH_LOGIN_BASE_URL:-https://login.microsoftonline.com}
      GRAPH_TENANT_ID: ${GRAPH_TENANT_ID:-}
      GRAPH_CLIENT_ID: ${GRAPH_CLIENT_ID:-}
      GRAPH_CLIENT_CERTIFICATE_THUMBPRINT: ${GRAPH_CLIENT_CERTIFICATE_THUMBPRINT:-}
      GRAPH_CLIENT_PRIVATE_KEY_BASE64: ${GRAPH_CLIENT_PRIVATE_KEY_BASE64:-}
    expose:
      - "3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1));",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - project-maker-internal

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "${WEB_PORT:?Set WEB_PORT in the selected env file}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --output-document=- http://127.0.0.1:8080/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - project-maker-edge
      - project-maker-internal

networks:
  project-maker-edge:
  project-maker-internal:
    internal: true

volumes:
  postgres-data:
