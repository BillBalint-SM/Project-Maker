name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checkpoint:
    runs-on: ubuntu-latest
    env:
      CORS_ORIGIN: http://localhost:8080
      DATABASE_URL: postgres://project_maker_app:ci-password@127.0.0.1:5432/project_maker_test
      CORRESPONDENCE_MAILBOX_NAME: Project Maker CI
      CORRESPONDENCE_MAILBOX_ADDRESS: project-maker-ci@example.test
      MAIL_GATEWAY_SMTP_HOST: 127.0.0.1
      MAIL_GATEWAY_SMTP_PORT: '2525'
      MAIL_GATEWAY_SMTP_SECURITY: STARTTLS_REQUIRED
      MAIL_GATEWAY_SMTP_USERNAME: ci-smtp-user
      MAIL_GATEWAY_SMTP_PASSWORD: ci-smtp-password
      MAIL_GATEWAY_IMAP_HOST: 127.0.0.1
      MAIL_GATEWAY_IMAP_PORT: '2143'
      MAIL_GATEWAY_IMAP_SECURITY: STARTTLS_REQUIRED
      MAIL_GATEWAY_IMAP_USERNAME: ci-imap-user
      MAIL_GATEWAY_IMAP_PASSWORD: ci-imap-password
      MAIL_GATEWAY_IMAP_FOLDER: INBOX
    services:
      postgres:
        image: postgres:18.4-alpine3.24
        env:
          POSTGRES_DB: project_maker_test
          POSTGRES_USER: project_maker_app
          POSTGRES_PASSWORD: ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U project_maker_app -d project_maker_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26.4.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run database migrations
        run: pnpm --filter @project-maker/api migration:run

      - name: Run verify
        run: pnpm verify

  mail-gateway:
    runs-on: ubuntu-latest
    env:
      CORS_ORIGIN: http://127.0.0.1:4200
      DATABASE_URL: postgres://project_maker_app:ci-password@127.0.0.1:5432/project_maker_mail_gateway_test
      CORRESPONDENCE_MAILBOX_NAME: Project Maker CI gateway
      CORRESPONDENCE_MAILBOX_ADDRESS: project-maker-ci@example.test
      MAIL_GATEWAY_SMTP_HOST: 127.0.0.1
      MAIL_GATEWAY_SMTP_PORT: '2525'
      MAIL_GATEWAY_SMTP_SECURITY: STARTTLS_REQUIRED
      MAIL_GATEWAY_SMTP_USERNAME: ci-smtp-user
      MAIL_GATEWAY_SMTP_PASSWORD: ci-smtp-password
      MAIL_GATEWAY_IMAP_HOST: 127.0.0.1
      MAIL_GATEWAY_IMAP_PORT: '2143'
      MAIL_GATEWAY_IMAP_SECURITY: STARTTLS_REQUIRED
      MAIL_GATEWAY_IMAP_USERNAME: ci-imap-user
      MAIL_GATEWAY_IMAP_PASSWORD: ci-imap-password
      MAIL_GATEWAY_IMAP_FOLDER: INBOX
    services:
      postgres:
        image: postgres:18.4-alpine3.24
        env:
          POSTGRES_DB: project_maker_mail_gateway_test
          POSTGRES_USER: project_maker_app
          POSTGRES_PASSWORD: ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U project_maker_app -d project_maker_mail_gateway_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26.4.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @project-maker/web exec playwright install --with-deps chromium

      - name: Build shared contracts
        run: pnpm --filter @project-maker/contracts build

      - name: Test authenticated TLS SMTP and IMAP protocol boundaries
        run: pnpm --filter @project-maker/api test:mail-gateway:protocol

      - name: Test one reviewed send and correlated reply through the controlled TLS gateway
        run: pnpm --filter @project-maker/web exec playwright test e2e/customer-follow-up-ping.spec.ts

  container-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run isolated production API container smoke
        run: node scripts/run-container-smoke.mjs
