name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checkpoint:
    runs-on: ubuntu-latest
    env:
      CORS_ORIGIN: http://localhost:8080
      DATABASE_URL: postgres://project_maker_app:ci-password@127.0.0.1:5432/project_maker_test
      CORRESPONDENCE_MAILBOX_NAME: Project Maker CI
      CORRESPONDENCE_MAILBOX_ADDRESS: project-maker-ci@example.test
      MAIL_GATEWAY_SMTP_HOST: 127.0.0.1
      MAIL_GATEWAY_SMTP_PORT: '2525'
      MAIL_GATEWAY_SMTP_SECURITY: STARTTLS_REQUIRED
      MAIL_GATEWAY_SMTP_USERNAME: ci-smtp-user
      MAIL_GATEWAY_SMTP_PASSWORD: ci-smtp-password
      MAIL_GATEWAY_IMAP_HOST: 127.0.0.1
      MAIL_GATEWAY_IMAP_PORT: '2143'
      MAIL_GATEWAY_IMAP_SECURITY: STARTTLS_REQUIRED
      MAIL_GATEWAY_IMAP_USERNAME: ci-imap-user
      MAIL_GATEWAY_IMAP_PASSWORD: ci-imap-password
      MAIL_GATEWAY_IMAP_FOLDER: INBOX
      MAIL_GATEWAY_CHECKPOINT_SECRET: ci-checkpoint-secret-with-at-least-32-characters
    services:
      postgres:
        image: postgres:18.4-alpine3.24
        env:
          POSTGRES_DB: project_maker_test
          POSTGRES_USER: project_maker_app
          POSTGRES_PASSWORD: ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U project_maker_app -d project_maker_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26.4.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run database migrations
        run: pnpm --filter @project-maker/api migration:run

      - name: Build shared contracts
        run: pnpm --filter @project-maker/contracts build

      - name: Run verify
        run: pnpm verify

  mail-gateway:
    runs-on: ubuntu-latest
    env:
      ACTIVE_PROJECT_QUEUE_CURSOR_SECRET: ci-mail-gateway-cursor-secret-at-least-32-characters
      CORS_ORIGIN: http://127.0.0.1:4200
      DATABASE_URL: postgres://project_maker_app:ci-password@127.0.0.1:5432/project_maker_mail_gateway_test
      CORRESPONDENCE_MAILBOX_NAME: Project Maker CI gateway
      CORRESPONDENCE_MAILBOX_ADDRESS: project-maker-ci@example.test
      MAIL_GATEWAY_SMTP_HOST: 127.0.0.1
      MAIL_GATEWAY_SMTP_PORT: '2525'
      MAIL_GATEWAY_SMTP_SECURITY: STARTTLS_REQUIRED
      MAIL_GATEWAY_SMTP_USERNAME: ci-smtp-user
      MAIL_GATEWAY_SMTP_PASSWORD: ci-smtp-password
      MAIL_GATEWAY_IMAP_HOST: 127.0.0.1
      MAIL_GATEWAY_IMAP_PORT: '2143'
      MAIL_GATEWAY_IMAP_SECURITY: STARTTLS_REQUIRED
      MAIL_GATEWAY_IMAP_USERNAME: ci-imap-user
      MAIL_GATEWAY_IMAP_PASSWORD: ci-imap-password
      MAIL_GATEWAY_IMAP_FOLDER: INBOX
      MAIL_GATEWAY_CHECKPOINT_SECRET: ci-mail-gateway-checkpoint-secret-at-least-32-characters
    services:
      postgres:
        image: postgres:18.4-alpine3.24
        env:
          POSTGRES_DB: project_maker_mail_gateway_test
          POSTGRES_USER: project_maker_app
          POSTGRES_PASSWORD: ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U project_maker_app -d project_maker_mail_gateway_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26.4.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @project-maker/web exec playwright install --with-deps chromium

      - name: Build shared contracts
        run: pnpm --filter @project-maker/contracts build

      - name: Run database migrations
        run: pnpm --filter @project-maker/api migration:run

      - name: Test the controlled TLS SMTP/IMAP gateway at every application seam
        run: pnpm test:mail-gateway:ci

  container-smoke:
    runs-on: ubuntu-latest
    env:
      ACTIVE_PROJECT_QUEUE_CURSOR_SECRET: ci-cursor-secret-with-at-least-32-characters
      COMPOSE_PROJECT_NAME: project-maker-container-smoke-${{ github.run_id }}-${{ github.run_attempt }}
      CORS_ORIGIN: http://localhost:8080
      CORRESPONDENCE_MAILBOX_ADDRESS: project-maker-container-smoke@example.test
      CORRESPONDENCE_MAILBOX_NAME: Project Maker CI
      DATABASE_URL: postgres://project_maker_app:ci-password@postgres:5432/project_maker_container_smoke
      MAIL_GATEWAY_SMTP_HOST: 127.0.0.1
      MAIL_GATEWAY_SMTP_PORT: '2525'
      MAIL_GATEWAY_SMTP_SECURITY: STARTTLS_REQUIRED
      MAIL_GATEWAY_SMTP_USERNAME: ci-smtp-user
      MAIL_GATEWAY_SMTP_PASSWORD: ci-smtp-password
      MAIL_GATEWAY_IMAP_HOST: 127.0.0.1
      MAIL_GATEWAY_IMAP_PORT: '2143'
      MAIL_GATEWAY_IMAP_SECURITY: STARTTLS_REQUIRED
      MAIL_GATEWAY_IMAP_USERNAME: ci-imap-user
      MAIL_GATEWAY_IMAP_PASSWORD: ci-imap-password
      MAIL_GATEWAY_IMAP_FOLDER: INBOX
      MAIL_GATEWAY_CHECKPOINT_SECRET: ci-checkpoint-secret-with-at-least-32-characters
      POSTGRES_DB: project_maker_container_smoke
      POSTGRES_PASSWORD: ci-password
      POSTGRES_USER: project_maker_app
      WEB_PORT: '8080'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build API container image
        run: docker compose --project-name "$COMPOSE_PROJECT_NAME" build api

      - name: Verify contracts runtime import in the image
        run: |
          docker compose --project-name "$COMPOSE_PROJECT_NAME" run --rm --no-deps --entrypoint node api -e "
            const { loadGeneralPlaybookV1 } = require('@project-maker/contracts/general-playbook-runtime');
            loadGeneralPlaybookV1()
              .then((playbook) => {
                if (playbook.id !== 'general' || playbook.version !== 1) {
                  throw new Error('The image did not load the canonical general v1 playbook.');
                }
              })
              .catch((error) => {
                console.error(error);
                process.exitCode = 1;
              });
          "

      - name: Start migrated API and PostgreSQL
        run: docker compose --project-name "$COMPOSE_PROJECT_NAME" up --wait postgres api

      - name: Smoke canonical policy consumers
        run: docker compose --project-name "$COMPOSE_PROJECT_NAME" exec -T api node --input-type=module - < apps/api/test/container-smoke.mjs

      - name: Remove container smoke resources
        if: always()
        run: docker compose --project-name "$COMPOSE_PROJECT_NAME" down --volumes --remove-orphans
